<!DOCTYPE html>
<html>
<head>
    <title>Claim & Status History</title>
</head>
<body>
    <h2>Your Posted Items & Claim Status</h2>
    <table border="1" width="100%">
        <tr>
            <th>Type</th>
            <th>Title</th>
            <th>Category</th>
            <th>Location</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        {% for item in items %}
        <tr>
            <td>{{ item[3] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[4] }}</td>
            <td>{{ item[5] }}</td>
            <td><b>{{ item[7] }}</b></td>
            <td>
                {% if item[7] == 'Open' %}
                    <a href="{{ url_for('claim_item', item_id=item[0]) }}">Mark as Claimed</a>
                {% else %}
                    Claimed
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{{ url_for('home') }}">Back to Dashboard</a></p>
</body>
</html>
