<!DOCTYPE html>
<html>
<head>
    <title>Post Item</title>
</head>
<body>
    <h2>Post Lost or Found Item</h2>
    <form method="POST">
        <label>Type:</label>
        <select name="type">
            <option value="Lost">Lost</option>
            <option value="Found">Found</option>
        </select><br><br>
        
        <label>Title:</label><br>
        <input type="text" name="title" required><br><br>
        
        <label>Category:</label><br>
        <input type="text" name="category" placeholder="Electronics, Keys, Wallet, etc." required><br><br>
        
        <label>Location:</label><br>
        <input type="text" name="location" placeholder="Library, Canteen, Hall, etc." required><br><br>
        
        <label>Description:</label><br>
        <textarea name="description" rows="4"></textarea><br><br>
        
        <button type="submit">Post</button>
    </form>
    <p><a href="{{ url_for('home') }}">Back to Dashboard</a></p>
</body>
</html>
